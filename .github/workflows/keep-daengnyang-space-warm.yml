name: Keep Daengnyang AI Space Warm

on:
  schedule:
    # Every six hours at :15 (KST: 03:15, 09:15, 15:15, 21:15)
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check model readiness with retries
        shell: bash
        run: |
          readonly READY_URL="https://teddymansion-daengnyang-breed-guess-json.hf.space/ready"
          readonly CAT_PREDICT_URL="https://teddymansion-daengnyang-breed-guess-json.hf.space/predict"
          readonly CAT_TEST_IMAGE="data:image/png;base64,"

          for attempt in $(seq 1 10); do
            status=$(curl --silent --show-error --output /tmp/space-ready.json --write-out "%{http_code}" --max-time 90 "$READY_URL" || true)
            if [ "$status" != "200" ]; then
              echo "Dog model is not ready yet (HTTP $status, attempt $attempt/10)."
              sleep 60
              continue
            fi

            cat_status=$(curl --silent --show-error --output /tmp/cat-ready.json --write-out "%{http_code}" --max-time 90 \
              --request POST "$CAT_PREDICT_URL" \
              --header "Content-Type: application/json" \
              --data "{\"species\":\"cat\",\"topK\":1,\"imageDataUrl\":\"$CAT_TEST_IMAGE\"}" || true)
            if [ "$cat_status" = "200" ]; then
              cat /tmp/space-ready.json
              cat /tmp/cat-ready.json
              exit 0
            fi

            echo "Cat model is not ready yet (HTTP $cat_status, attempt $attempt/10)."
            sleep 60
          done

          echo "Space did not become ready after 10 attempts."
          exit 1
